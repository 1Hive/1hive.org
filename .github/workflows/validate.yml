name: Validate website contributions

on:
  pull_request:
    branches:
      - v4
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check types and formatting
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build site
        run: npm run build
      - name: Check generated links and agent resources
        run: npm run check:site
